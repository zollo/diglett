apiVersion: v1
kind: Service
metadata:
  name: {{ include "diglett.name" . }}
  labels:
    {{- include "diglett.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    {{- include "diglett.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
      nodePort: {{ .Values.service.nodePort }}
