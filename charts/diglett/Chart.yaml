# image.tag falls back to "latest". Once a vX.Y.Z image exists, set
# appVersion: "X.Y.Z" here to pin the chart to it.
home: https://github.com/zollo/diglett
sources:
  - https://github.com/zollo/diglett
icon: https://raw.githubusercontent.com/zollo/diglett/main/deploy/truenas/diglett/icon.svg
keywords:
  - dns
  - dig
  - networking
  - lookup
maintainers:
  - name: Diglett contributors
    url: https://github.com/zollo/diglett
